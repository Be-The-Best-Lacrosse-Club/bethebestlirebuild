<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <!-- Half-field lacrosse diagram — base layer for the Coach's Whiteboard.
       Explicit width/height attributes are required so canvas drawImage works in Firefox. -->

  <!-- Whiteboard background -->
  <rect x="0" y="0" width="800" height="1000" fill="#f0f5e6"/>

  <!-- Field border -->
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#6b8e4e" stroke-width="4" rx="4"/>

  <!-- Midfield line (top of the half field) with center X -->
  <line x1="40" y1="40" x2="760" y2="40" stroke="#6b8e4e" stroke-width="6"/>
  <line x1="388" y1="28" x2="412" y2="52" stroke="#6b8e4e" stroke-width="4"/>
  <line x1="412" y1="28" x2="388" y2="52" stroke="#6b8e4e" stroke-width="4"/>

  <!-- Substitution box ticks on the midfield line -->
  <line x1="200" y1="40" x2="200" y2="64" stroke="#6b8e4e" stroke-width="3"/>
  <line x1="600" y1="40" x2="600" y2="64" stroke="#6b8e4e" stroke-width="3"/>

  <!-- Restraining line -->
  <line x1="40" y1="330" x2="760" y2="330" stroke="#6b8e4e" stroke-width="3" stroke-dasharray="16,8"/>

  <!-- Alley hash marks -->
  <line x1="180" y1="330" x2="180" y2="960" stroke="#6b8e4e" stroke-width="1.5" stroke-dasharray="4,10" opacity="0.5"/>
  <line x1="620" y1="330" x2="620" y2="960" stroke="#6b8e4e" stroke-width="1.5" stroke-dasharray="4,10" opacity="0.5"/>

  <!-- 12m fan arc (girls) / spacing reference -->
  <path d="M 160 830 A 240 240 0 0 1 640 830" fill="none" stroke="#6b8e4e" stroke-width="2" stroke-dasharray="10,6" opacity="0.7"/>

  <!-- Goal line extended -->
  <line x1="40" y1="830" x2="292" y2="830" stroke="#6b8e4e" stroke-width="2" stroke-dasharray="8,8"/>
  <line x1="508" y1="830" x2="760" y2="830" stroke="#6b8e4e" stroke-width="2" stroke-dasharray="8,8"/>

  <!-- Crease -->
  <circle cx="400" cy="830" r="108" fill="#e6eed9" stroke="#6b8e4e" stroke-width="4"/>

  <!-- Goal line + goal -->
  <line x1="340" y1="830" x2="460" y2="830" stroke="#6b8e4e" stroke-width="4"/>
  <path d="M 370 830 L 400 878 L 430 830" fill="none" stroke="#333333" stroke-width="5" stroke-linejoin="round"/>

  <!-- Watermark -->
  <text x="400" y="215" text-anchor="middle" fill="#6b8e4e" opacity="0.16"
    font-family="Arial Narrow, Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="14">BTB</text>
  <text x="400" y="252" text-anchor="middle" fill="#6b8e4e" opacity="0.16"
    font-family="Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="8">BE THE BEST LACROSSE</text>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're In - BTB Lacrosse</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', Arial, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    .badge {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(210,38,48,0.15);
      border: 2px solid #D22630;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .badge img {
      width: 68px;
      height: 68px;
      object-fit: contain;
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #D22630;
      margin-bottom: 12px;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(42px, 12vw, 68px);
      color: #fff;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 0.95;
      margin-bottom: 16px;
    }
    h1 span { color: #D22630; }
    p {
      font-size: 15px;
      color: #aaa;
      line-height: 1.7;
      max-width: 340px;
      margin: 0 auto 32px;
    }
    p strong { color: #fff; }
    .cta {
      display: inline-block;
      background: #D22630;
      color: #fff;
      text-decoration: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 16px 36px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .secondary {
      display: block;
      font-size: 13px;
      color: #555;
      text-decoration: none;
      letter-spacing: 1px;
      margin-top: 8px;
    }
    .secondary:hover { color: #888; }
  </style>
</head>
<body>
  <div class="badge">
    <img src="/assets/brand/btb-circle-logo.png" alt="BTB Lacrosse Club" />
  </div>
  <p class="eyebrow">BTB Lacrosse</p>
  <h1>YOU'RE <span>IN.</span></h1>
  <p>
    Welcome to the BTB family. <strong>Free clinic alerts, evaluation updates, and exclusive news</strong> are headed to your inbox.
  </p>
  <a class="cta" href="/players-wanted#request-evaluation">REQUEST AN EVALUATION</a>
  <a class="secondary" href="/">Back to bethebestli.com</a>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Confirmed — BTB Lacrosse</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .checkmark {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(255,0,10,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }
    .checkmark svg { width: 36px; height: 36px; }
    h1 {
      font-family: 'Anton', 'Arial Black', sans-serif;
      font-size: clamp(2.2rem, 6vw, 3.75rem);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #FF000A;
      line-height: 1.05;
      margin-bottom: 16px;
    }
    .divider {
      width: 48px;
      height: 3px;
      background: #FF000A;
      margin: 20px auto 24px;
    }
    p {
      font-size: 1.1rem;
      color: #ccc;
      max-width: 440px;
      line-height: 1.65;
      margin-bottom: 10px;
    }
    p strong { color: #fff; }
    a.btn {
      display: inline-block;
      margin-top: 32px;
      padding: 14px 40px;
      background: #FF000A;
      color: #fff;
      font-family: 'Anton', 'Arial Black', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 4px;
    }
    a.btn:hover { background: #cc0008; }
  </style>
</head>
<body>
  <div class="checkmark">
    <svg viewBox="0 0 24 24" fill="none" stroke="#FF000A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <h1>You're Confirmed.</h1>
  <div class="divider"></div>
  <p><strong>You're officially on the BTB list.</strong></p>
  <p>You'll hear from us on tryouts, camps, events, and program news. Nothing extra, nothing you didn't ask for.</p>
  <a href="https://www.bethebestli.com" class="btn">Back to BTB →</a>
</body>
</html>

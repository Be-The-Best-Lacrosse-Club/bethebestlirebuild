<title>BTB Recruiting Hub · Access Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --btb-red: #D22630;
  --btb-red-dark: #a01e26;
  --btb-black: #0A0A0A;
  --btb-off-white: #F5F5F5;
  --btb-border: #E5E5E5;
  --btb-text: #1A1A1A;
  --btb-text-muted: #6A6A6A;
  --font-heading: 'Bebas Neue', 'Arial Narrow', sans-serif;
  --font-body: 'Montserrat', 'Helvetica Neue', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--btb-black);
  color: white;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(circle at 50% 0%, rgba(200, 16, 46, 0.15), transparent 60%);
}
.login-box {
  width: 100%;
  max-width: 440px;
  background: #111;
  border: 1px solid rgba(255,255,255,0.08);
  padding: 2.5rem 2rem;
  text-align: center;
  border-top: 4px solid var(--btb-red);
}
.btb-logo-img {
  display: block;
  max-width: 130px;
  height: auto;
  margin: 0 auto 1.25rem;
  filter: drop-shadow(0 4px 12px rgba(200, 16, 46, 0.4));
}
.eyebrow {
  font-family: var(--font-heading);
  font-weight: 500;
  font-size: 0.6875rem;
  letter-spacing: 0.3em;
  color: var(--btb-red);
  text-transform: uppercase;
  margin-bottom: 0.5rem;
}
.title {
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: 1.5rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 0.5rem;
}
.subtitle {
  font-size: 0.875rem;
  color: rgba(255,255,255,0.6);
  margin-bottom: 2rem;
}
.field {
  text-align: left;
  margin-bottom: 1rem;
}
.field label {
  display: block;
  font-family: var(--font-heading);
  font-weight: 500;
  font-size: 0.6875rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
  margin-bottom: 0.5rem;
}
.field input {
  width: 100%;
  background: #0a0a0a;
  border: 1px solid rgba(255,255,255,0.15);
  color: white;
  font-family: var(--font-body);
  font-size: 1rem;
  padding: 0.75rem 1rem;
  border-radius: 2px;
  transition: border-color 0.2s;
}
.field input:focus {
  outline: none;
  border-color: var(--btb-red);
}
.btn-primary {
  width: 100%;
  background: var(--btb-red);
  color: white;
  border: none;
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 0.875rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 0.875rem;
  cursor: pointer;
  transition: background 0.2s;
  margin-top: 0.5rem;
}
.btn-primary:hover { background: var(--btb-red-dark); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.msg {
  margin-top: 1rem;
  padding: 0.75rem;
  font-size: 0.875rem;
  border-radius: 2px;
  display: none;
}
.msg.error {
  background: rgba(200, 16, 46, 0.15);
  border: 1px solid var(--btb-red);
  color: #ffaaba;
  display: block;
}
.msg.info {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.8);
  display: block;
}
.forgot {
  margin-top: 1.25rem;
  font-size: 0.8125rem;
  color: rgba(255,255,255,0.5);
}
.forgot a {
  color: var(--btb-red);
  text-decoration: none;
  font-weight: 600;
}
.forgot a:hover { text-decoration: underline; }
.access-note {
  margin-top: 2rem;
  padding-top: 1.5rem;
  border-top: 1px solid rgba(255,255,255,0.08);
  font-size: 0.75rem;
  color: rgba(255,255,255,0.4);
  line-height: 1.5;
}
</style>
</head>

  <div class="eyebrow">BTB Recruiting Hub</div>
  <h1 class="title">Family Access Code</h1>
  <p class="subtitle">One BTB family code. It changes every two weeks.</p>

  <form id="login-form">
    <div class="field">
      <label for="access-code">Access Code</label>
      <input type="text" id="access-code" name="access-code" required autocomplete="off" autocapitalize="characters" spellcheck="false">
    </div>
    <button type="submit" class="btn-primary" id="submit-btn">Sign In</button>
  </form>

  <div class="msg" id="message"></div>

  <p class="forgot">
    Need the current code? <a href="mailto:info@bethebestli.com?subject=BTB Hub Access">Email Coach Dan</a>
  </p>

  <p class="access-note">
    Access is reserved for current BTB families. The code rotates every two weeks.
  </p>
</div>

<script>
(async function() {
  const ACCESS_STORAGE_KEY = 'btb_recruiting_access';
  const OWNER_STORAGE_KEY = 'btb-owner-access-until';
  const ACCESS_ENDPOINT = '/.netlify/functions/recruiting-hub-access';
  const form = document.getElementById('login-form');
  const messageEl = document.getElementById('message');
  const submitBtn = document.getElementById('submit-btn');

  function showMessage(text, type) {
    messageEl.className = 'msg ' + type;
    messageEl.textContent = text;
  }

  async function verifyOwnerAccess() {
    if (Number(localStorage.getItem(OWNER_STORAGE_KEY)) <= Date.now()) return false;

    try {
      const response = await fetch(ACCESS_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ owner: true })
      });
      if (!response.ok && (response.status === 401 || response.status === 403)) {
        localStorage.removeItem(OWNER_STORAGE_KEY);
      }
      return response.ok;
    } catch (error) {
      return false;
    }
  }

  async function verifySavedAccess() {
    const token = localStorage.getItem(ACCESS_STORAGE_KEY);
    if (!token) return false;

    try {
      const response = await fetch(ACCESS_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token })
      });

      if (!response.ok) {
        localStorage.removeItem(ACCESS_STORAGE_KEY);
        return false;
      }

      return true;
    } catch (error) {
      return false;
    }
  }

  if (await verifyOwnerAccess() || await verifySavedAccess()) {
    window.location.href = '/recruiting-hub/hub/';
    return;
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';
    showMessage('', 'info');

    const code = document.getElementById('access-code').value;

    try {
      const response = await fetch(ACCESS_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code })
      });
      const result = await response.json();

      if (!response.ok || !result.token) {
        showMessage(result.error || 'Access code expired or incorrect. Check the current BTB code.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
        return;
      }

      localStorage.setItem(ACCESS_STORAGE_KEY, result.token);
      window.location.href = '/recruiting-hub/hub/';
    } catch (error) {
      showMessage('Could not check the code. Try again or email Coach Dan.', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  });
})();
</script>

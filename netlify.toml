# Netlify Identity — route confirmation/recovery/invite tokens to the SPA
# MUST be before the /* catch-all or they'll never be evaluated
[[redirects]]
  from = "/confirmation"
  to = "/login#confirmation_token=:token"
  status = 302
  query = { confirmation_token = ":token" }

[[redirects]]
  from = "/recovery"
  to = "/login#recovery_token=:token"
  status = 302
  query = { token = ":token" }

[[redirects]]
  from = "/invite"
  to = "/login#invite_token=:token"
  status = 302
  query = { token = ":token" }

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images are content-addressed by neither name nor hash, so they can't be
# immutable — but no-store meant every visitor re-downloaded all of them on
# every page view. A week of caching with revalidation is the right middle.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/btb-staff-calendar.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/btb-staff-calendar-sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Service-Worker-Allowed = "/dan-calendar"
